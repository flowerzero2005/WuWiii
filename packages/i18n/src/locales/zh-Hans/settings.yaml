    retry: 重试
    start: 开始吧！
    select-model: 选择模型
    no-models: 找不到可用模型
    no-models-help: >-
      请返回前面的步骤，根据当前连接方式检查服务账号、API 密钥或本地模型服务。
    back: 返回
    credentials:
      title: 请妥善保管服务密钥
      description: API 密钥会保存在当前呜异屋安装中。请把它当作密码，不要与他人分享。
    officialCloud:
      title: 账号登录需要单独完成
      description: 这里只会选择呜异屋官方云，不会自动登录或购买点数。完成向导后，请到“账号与点数”登录，再发起第一次云端请求。
    localProvider:
      title: 本地模型服务需要已经在运行
      description: 呜异屋会保存并连接这个本地地址，但不会替你安装、下载或启动 Ollama 或 LM Studio。
    steps:
      path:
        title: 选择呜异屋连接 AI 的方式
        description: 按照账号、隐私和部署需求选择。完成后仍可随时更换服务来源。
        options:
          official-cloud:
            title: 呜异屋官方云
            description: 最省心的路径。完成向导后登录并使用账号点数，这里不需要填写第三方 API 密钥。
          byok:
            title: 使用自己的 API 密钥
            description: 使用你自己管理的密钥，连接 OpenAI、Anthropic、Gemini、OpenRouter 或其他兼容服务。
          local:
            title: 纯本地模型
            description: 连接本机运行的 Ollama 或 LM Studio。呜异屋不会替你安装或启动本地模型服务。
        selected:
          official-cloud: 你选择了官方云。这里不需要服务密钥，但仍需在“账号与点数”中单独登录。
          byok: 你选择了自带密钥。请选择你已经持有密钥的云端服务来源。
          local: 你选择了本地模型。请先确认 Ollama 或 LM Studio 已安装、正在运行并开放本地 API。
      personalize:
        title: 让数字居民更像你的伙伴
        description: 人物与外观独立于 AI 服务来源。本向导不会替你导入或更换人物。
        items:
          character:
            title: 人物与人格
            description: 选择内置人物或导入人物包，并检查对应的人格和模型设置。
            location: 设置 > 人物
          theme:
            title: 主题与对话外观
            description: 在外观设置中选择明暗模式、颜色、背景和消息样式。
            location: 设置 > 系统 > 外观与背景
      voice:
        title: 语音与麦克风
        description: 语音输出和语音输入都是可选项。只有真正使用麦克风功能时，呜异屋才会请求设备权限。
        items:
          speech:
            title: 语音输出
            description: 选择并测试语音服务、模型和音色。选择聊天模型不会自动配置语音。
            location: 设置 > 模块 > 语音
          microphone:
            title: 语音输入
            description: 使用语音输入前，请选择转写服务和输入设备。
            location: 设置 > 模块 > 听觉
          permission:
            title: 麦克风权限
            description: 录音开始时再在系统弹窗中授权。本向导不会提前申请麦克风权限。
            location: 开始录音时由操作系统请求
      tools:
        title: 桌面工具
        description: 这些工具只有在你主动打开时才会出现，正式使用前可以先了解各自的工作方式。
        items:
          quick-chat:
            title: 快捷聊天
            description: 紧凑的桌面对话窗口，拥有独立的尺寸、位置和语音行为设置。
            location: 设置 > 系统 > 快捷聊天
          butler:
            title: Butler 管家
            description: 用于创建和确认提醒、闹钟与计时器。确认流程成功前，呜异屋不会声称任务已创建。
            location: 从桌面控制区打开 Butler
          workbench:
            title: 工作台
            description: 在工作区中处理文件、预览、工具和较长任务；有副作用的操作仍遵循各自的确认规则。
            location: 从桌面控制区打开工作台
      data:
        title: 数据与诊断
        description: 呜异屋会在当前安装中保存本地对话和偏好数据；破坏性清理始终需要明确确认。
        items:
          storage:
            title: 数据控制
            description: 修改前先查看已存数据以及导出、重置等选项。
            location: 设置 > 数据
          diagnostics:
            title: 记忆诊断
            description: 当记忆召回不符合预期时，可检查记忆健康状态和索引情况。
            location: 设置 > 记忆 > 诊断
          cleanup:
            title: 数据清理
            description: 向导不会自动清理数据。请之后到数据设置中操作，并确认具体会删除什么。
            location: 设置 > 数据
    summary:
      title: 设置概览
      description: 聊天服务和模型已经选好。人物、语音、工具与数据等可选设置可在完成后继续调整。
      path: 连接方式
      provider: 服务来源
      model: 模型
      notSelected: 未选择
      afterTitle: 完成后继续设置
      afterDescription: 下列区域包含向导提到的可选控制项；其中的设置没有被自动修改。
      afterItems:
        character: 人物与外观
        voice: 语音与麦克风
        tools: 桌面工具
        data: 数据与诊断
      complete: 完成设置
