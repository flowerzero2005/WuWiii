      title: 语音播放
      description: 配置播放缓冲、TTS 超时和语音打断。
      info:
        title: 播放策略会直接影响首段延迟
        description: 低延迟中文回复建议先关闭播放缓冲，并保留较短的 TTS 超时，避免慢 provider 阻塞后续语音。
      sections:
        output:
          title: 语音输出
          description: 控制聊天回复是否自动合成并播放语音。
        buffering:
          title: 播放缓冲
          description: 控制语音片段是立即播放还是等待更多片段后再播放。
          how-it-works-title: 工作原理
          how-it-works-description: 启用缓冲后，系统会等待至少 {minSegments} 个语音片段，或等待 {bufferTimeout}ms 后开始播放。关闭缓冲时首段语音更快，开启缓冲时长回复会更连贯。
        interruption:
          title: 语音打断
          description: 控制用户说话时如何打断正在播放的 AI 语音。
          how-it-works-title: 工作原理
          how-it-works-description: 启用智能打断后，系统会检测用户语音状态。只有持续检测到用户说话超过 {threshold}ms 时，才会打断 AI 语音，降低环境噪声误触发。
      fields:
        speech-output-enabled:
          label: 启用 AI 回复语音
          description: 关闭后聊天回复不会发起 TTS 请求，可避免无意消耗语音额度；测试声音不受影响。
        output-volume:
          label: 播放音量
          description: 调整当前居民的语音播放音量，不影响系统音量。
        emotion-mode:
          label: 情感语音
          description: 选择语气是否跟随当前角色和对话情境；不支持情感控制的语音模型会保持原本的中性输出。
        emotion-intensity:
          label: 情感强度
          description: 控制情感语气偏离中性的程度。默认保持克制，调到 0% 等同于中性语气。
        display-sync-with-speech:
          label: 气泡跟随语音输出
          description: 开启后，回复气泡会等待语音合成或播放事件后再显示，让思考气泡持续到语音准备好。
        display-sync-trigger:
          label: 气泡显示触发点
          description: “开始播放”更适合对齐 Live2D 嘴型；“合成完成”会更早显示，但可能早于实际声音。
        display-sync-late-speech-policy:
          label: 迟到语音处理
          description: 当前轮语音超过同步兜底时间仍未准备好时，是继续等语音，还是先显示文字并丢弃迟到语音。
        display-sync-delay:
          label: 气泡显示延迟微调
          description: 在语音事件后额外等待多久再显示气泡，用于手动校准嘴型和气泡时机。
        display-sync-fallback:
          label: 同步兜底时间
          description: 如果语音合成失败或没有返回音频，超过该时间后仍然显示文字，避免一直停在思考状态。
        buffering-enabled:
          label: 启用播放缓冲
          description: 等待多个语音片段合成完成后再播放。语音更连贯，但首段延迟会增加。
        tts-request-timeout:
          label: TTS 请求超时
          description: 单个语音片段超过该时间仍未返回时跳过，并降低该 provider 在推荐系统里的优先级。中文低延迟建议 3500-6000ms。
        tts-request-min-interval:
          label: TTS 请求最小间隔
          description: 每次语音合成请求之间至少等待多久。默认 0 表示不主动限速；遇到 provider 429 时可适当调高。
        tts-rate-limit-retry-delay:
          label: 限流重试冷却
          description: Provider 返回 429 或 rate limit 后等待多久再重试。复刻声线或严格限流模型可调高到 6000-12000ms。
        min-segments:
          label: 最少缓冲片段数
          description: 至少缓冲多少个语音片段后才开始播放。低延迟建议 1-2，流畅模式建议 3-5。
        buffer-timeout:
          label: 缓冲超时时间
          description: 超过此时间后自动开始播放，避免等待过久。低延迟建议 600-1200ms。
        interruption-enabled:
          label: 启用智能打断
          description: 只有持续检测到用户语音输入时才会打断 AI 语音，避免短噪声误触发。
        continuous-detection-threshold:
          label: 持续检测阈值
          description: 需要持续检测到用户语音多久才触发打断。建议 300-1000ms。
        speech-end-buffer:
          label: 语音结束缓冲
          description: 用户停止说话后等待多久才认为语音结束。建议 300-800ms。
      units:
        segments: '{count} 个片段'
      options:
        emotion-mode:
          follow-character: 跟随角色
          natural: 自然克制
          off: 关闭
        display-sync-trigger:
          playback-start: 开始播放
          tts-result: 合成完成
        display-sync-late-speech-policy:
          text-first-drop-late: 文字优先，丢弃迟到语音
