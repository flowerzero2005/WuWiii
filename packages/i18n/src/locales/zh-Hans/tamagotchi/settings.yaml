allow-visible-on-all-workspaces:
  title: 跨桌面可见性
  description: 允许窗口在所有虚拟桌面中可见，仅限 macOS。
pages:
  notifications:
    title: 通知中心
    description: 查看曾经收到的产品公告。公告负责单向通知，客服回复由 QQ 群承接。
    open-center: 查看通知中心
    refresh: 刷新公告
    refresh-behavior: 主界面启动、切换显示语言后及运行期间每 15 分钟会自动刷新公告；打开本页也会立即刷新。已收到的公告保存在本机，离线时仍可查看。
    refresh-error: 暂时无法刷新公告，下面仍保留此前收到的内容。
    empty: 暂时没有公告。
    popups:
      title: 弹出公告提醒
      description: 关闭后公告仍会保存在通知中心，但不会在主界面弹出；重新开启时不会补弹关闭期间收到的旧公告。
    level:
      critical: 重要
      warning: 提醒
      info: 通知
    status:
      cached: 已离线保存
    support:
      title: 付费 Beta 客服
      description: 如有付费 Beta 使用问题或反馈，请加入 QQ 群。公告只负责发布通知，客服回复在群内进行。
      group-label: QQ 群
      copy: 复制群号
      copied: QQ 群号已复制。
      copy-error: 无法复制 QQ 群号。
  official-voices:
    title: 官方声线
    description: 浏览、搜索并收藏 Wuwiii 官方声线；选择通过服务端目录确认后才会生效。
    views:
      recommended: 推荐
      all: 全部
      favorites: 收藏
      recent: 最近
    channels:
      primary: 主链路声线
      secondary: 备用链路声线
    statuses:
      idle: 空闲
      busy: 忙碌
      congested: 拥挤
      maintenance: 维护中
      error: 暂不可用
      recovering: 恢复中
    search: 搜索名称、说明或声线 ID
    all-languages: 全部语言
    current: 当前声线
    billing-rule: '基础 {points} 点/分钟，最低 {minimum} 点；声线附加 {surcharge} 点/次'
    per-minute: 基础语音
    minimum-base: 单次最低基础
    per-use-surcharge: 声线附加
    points-short: 点
    points-value: '{points} 点'
    points-per-minute: '{points} 点/分钟'
    points-per-use: '{points} 点/次'
    rate-with-surcharge: '{points} 点/分钟 + {surcharge} 点/次'
    price-follows-server: 最终按实际语音时长结算
    loading: 正在加载官方声线…
    load-error: 官方声线目录暂时无法加载，当前声线没有改变，请稍后重试。
    empty: 没有找到符合条件的声线。
    favorite: 收藏声线
    points: 点/次
    use: 使用此声线
    in-use: 正在使用
    unavailable: 这条声线已下架或当前套餐不可用，原声线保持不变。
    selected: 声线已切换。
    preview: 试听声线
    preview-error: 试听暂时无法播放。
    load-more: 加载更多
  modules:
    mcp-server:
      description: 连接与管理 MCP 服务器和工具
      title: MCP 服务器
  speech:
    title: 语音设置
    description: 把当前居民的声线、播放节奏和响应速度调成你喜欢的样子，呜异屋会保存这些选择。
    info:
      title: 语音交互集中设置
      description: 声音从哪里来、怎样听见你、何时开口，都可以在这里调整。
    providers:
      title: 语音厂商
      description: 接入常用的 TTS/STT 服务，让当前居民用你喜欢的声音听见并回应你。
  system:
    sections:
      section:
        window-shortcuts:
          title: 键盘快捷键
    window-shortcuts:
      description: 修改窗口快捷方式
      title: 窗口快捷方式
      toggle-move:
        label: 切换移动状态
      toggle-resize:
        label: 调整大小
      toggle-ignore-mouse-event:
        label: 忽略鼠标事件
      press-keys: 请按下按键...
    speech-output:
      title: 语音输出
      description: 在更快开口和更连贯的表达之间，选择适合你的输出节奏。
      mode:
        label: 输出模式
        fast: 低延迟
        balanced: 平衡
        smooth: 流畅
        custom: 自定义
      mode-description:
        fast: 抢先送出第一小段语音，适合想立刻听见中文回复时使用。
        balanced: 兼顾开口速度与自然停顿，日常聊天会比较顺耳。
        smooth: 等句子更完整后再开口，听起来连贯一些，也会多等一会儿。
        custom: 分段与首段加速都交给你亲手安排。
      custom-settings:
        title: 自定义分段
        boost:
          label: 首段加速
          description: 开头几段准备好后立即送出，缩短第一句话的等待时间。
        min-words:
          label: 最小语音单位
          description: 片段优先等待到这个长度后再输出。
        max-words:
          label: 最大语音单位
          description: 没有标点时达到这个长度也会强制输出。
        merge-short-sentences:
          label: 合并短句
          description: 先合并过短的句子，让语音更完整，也减少连续 TTS 请求。
    speech-playback:
      title: 语音播放
      description: 调整播放缓冲、TTS 超时与语音打断，让每次开口都更跟手。
    speech-latency:
      title: 语音延迟
      description: 查看最近一次 TTS 的合成、解码、首声延迟和失败位置。
    quick-chat:
      title: 快捷聊天
      description: 把桌面快捷聊天与角色旁的回复气泡，打扮成你看着顺眼的模样。
      info:
        title: 桌面快捷聊天界面
        description: 这里的选择会一起照顾浮动输入窗口，以及快捷聊天唤出的角色旁气泡。
      sections:
        behavior: 窗口
        bubbles: 回复气泡
      window-controls:
        close-settings: 关闭快捷聊天设置
        drag: 拖动快捷聊天
        drag-voice-call: 拖动语音通话窗口
        expand: 展开快捷聊天
        resize: 拖动上方短柄可移动，拖动左右边缘可调整宽度
        settings: 打开快捷聊天设置
        collapse: 收起快捷聊天
        hide: 隐藏快捷聊天
        hide-confirm-title: 隐藏快捷聊天？
        hide-confirm-description: 隐藏后可以从管家球或托盘菜单再次打开，当前聊天记录不会丢失。
        hide-confirm-cancel: 取消
        hide-confirm-action: 确认隐藏
        you: 我
      custom-position:
        title: 已保存自定义位置
        description: 当前窗口位置为 X {x}，Y {y}。
        clear: 清除自定义位置
      fields:
        recommended-replies:
          description: 默认关闭。开启后，每次助手回复完成都会向当前第三方聊天服务额外请求一次，可能产生服务商费用；官方云在支持独立计价确认前不会生成。
          label: 生成推荐回复（每次会额外请求一次模型）
        floating-replies-enabled:
          label: 显示桌面浮动回复
          description: 仅在收起快捷聊天或语音通话时，在角色附近显示用户、思考和回复气泡。
        follow-chat-appearance:
          label: 跟随聊天气泡外观
          description: 让桌面回复气泡与正常聊天共用字体、颜色、图片和形状；关闭后可分别设置。
        auto-open:
          label: 启动时打开快捷聊天
          description: 桌面舞台醒来时，快捷聊天输入框也会乖乖出现。
        always-on-top:
          label: 保持置顶
          description: 让快捷聊天停在普通桌面窗口上方，随时等你开口。
        visible-on-all-workspaces:
          label: 在所有工作区显示
          description: 切换虚拟桌面时仍保持快捷聊天可见。
        click-through-when-blurred:
          label: 失焦后点击穿透
          description: 快捷聊天窗口失去焦点后让鼠标点击穿透到下方窗口。重新打开快捷聊天后可再次交互。
        dock:
          label: 停靠位置
          description: 安排快捷聊天折叠后待在哪里；选择自定义后，可以亲手拖到喜欢的位置。
        collapsed-width:
          label: 折叠宽度
          description: 紧凑输入条的宽度。
        expanded-width:
          label: 展开宽度
          description: 展开聊天面板的宽度。
        expanded-height:
          label: 展开高度
          description: 展开聊天面板的高度。
        separate-dark-background:
          label: 单独设置深色背景
          description: 想让深色模式换一身装扮时，就为它单独选张背景吧。
        floating-user-background-light:
          label: 我的桌面气泡背景
          description: 为你已发送的消息气泡铺上一张桌面背景图片。
        floating-user-background-dark:
          label: 我的深色桌面气泡背景
          description: 深色模式下，你已发送的消息气泡会使用这张背景图片。
        floating-assistant-background-light:
          label: 居民桌面气泡背景
          description: 为当前居民的桌面回复气泡挑一张陪你聊天的背景图片。
        floating-assistant-background-dark:
          label: 居民深色桌面气泡背景
          description: 深色模式下，当前居民的桌面回复气泡会换上这张背景图片。
        floating-background-strength:
          label: 桌面气泡图片强度
          description: 调淡或调浓气泡图片，别让漂亮背景盖住要说的话。
        reply-anchor:
          label: 回复气泡位置
          description: 决定当前居民的回复气泡从哪里出现。
        thinking-bubble-offset-x:
          label: 思考气泡水平偏移
          description: 调整思考气泡相对角色参考位置的左右距离，负值向左，正值向右。
        thinking-bubble-offset-y:
          label: 思考气泡垂直偏移
          description: 调整思考气泡相对角色参考位置的上下距离，负值向上，正值向下。
        reply-bubble-offset-x:
          label: 回复气泡水平偏移
          description: 调整回复气泡相对角色参考位置的左右距离，负值向左，正值向右。
        reply-bubble-offset-y:
          label: 回复气泡垂直偏移
          description: 调整回复气泡相对角色参考位置的上下距离，负值向上，正值向下。
        sent-preview-duration:
          label: 发送预览停留时间
          description: 决定你的消息预览气泡要在桌面上停留多久。
        reply-bubble-dwell:
          label: 回复气泡停留时间
          description: 当前居民打完字后，回复气泡还会停留这么久。
        bubble-enter-duration:
          label: 气泡出现动画时间
          description: 调整气泡来到你面前时的动画时长。
        bubble-exit-duration:
          label: 气泡消失动画时间
          description: 调整气泡轻轻退场时的动画时长。
      options:
        background:
          none: 不使用图片
        dock:
          top-left: 左上
          top-right: 右上
          bottom-left: 左下
          bottom-right: 右下
          custom: 自定义 / 已拖拽
        reply-anchor:
          near-character: 角色附近
          top-center: 顶部居中
          bottom-center: 底部居中
      actions:
        reset-behavior: 重置窗口
        reset-bubbles: 重置气泡
        reset: 重置全部快捷聊天设置
    developer:
      sections:
        section:
          use-window-mouse:
            title: 使用窗口鼠标工具
            description: 测试 Electron 窗口鼠标位置
    memory-advanced:
      title: 高级设置
      description: 调整记忆与对话的进阶能力，让陪伴方式更贴近你的习惯。
      info:
        title: 系统高级功能
        description: 这些能力默认保持待机，可按需逐项开启；现有配置仍会保持兼容。
      scope-overview:
        title: 记忆如何隔离
        description: 会话历史与长期记忆使用不同边界，避免一个人格继承另一个人格的私有理解。
        persona:
          title: 人格记忆
          status: 已隔离
          description: 单聊长期记忆按用户与人格分别保存。
        room:
          title: 房间历史
          status: 已记录
          description: 公开消息会保留所属房间和发言角色身份。
        group:
          title: 群聊长期记忆
          status: 已暂停
          description: 在房间与人格作用域可显式传入前，不会自动提取群聊长期记忆。
      isolation:
        title: 记忆隔离
        multi-user:
          label: 启用多用户识别
          description: 根据设备区分不同用户，并为每个人独立保存记忆。
          warning: 首次启用会自动迁移现有数据到新用户，原有数据不会丢失
      semantic:
        title: 语义理解
        search:
          label: 启用语义搜索
          description: 借助知识图谱扩展关键词，提高相关记忆的召回率。
        official-cloud-embedding:
          label: 使用官方云嵌入
          description: 开启后，当前查询和符合条件的记忆文本会发送到 Wuwiii 官方嵌入服务并消耗账户点数；服务不可用时会自动使用本地关键词召回。此项默认关闭。
          pricing:
            loading: 正在读取官方云当前价格…
            official: '官方云：每次嵌入请求 {points} 点。本地关键词召回不消耗官方点数。'
          status:
            checking: 正在确认官方语义记忆服务状态…
            available: 官方语义记忆服务可用；开启后才会发送文本并按服务端实时价格扣点。
            unavailable: 官方语义记忆服务暂不可用，当前继续使用本地关键词召回，且不会发送记忆文本。
        value-judgment:
          label: 智能价值判断
          description: 再判断一次哪些内容值得长期保留，过滤临时和低价值信息。
      natural:
        title: 自然对话
        conversation-init:
          label: 对话初始化
          description: 在开始对话时带入与你有关的记忆，让开场更连贯自然。
        inner-voice-prewarm:
          label: 自动预热心声札记
          description: 回复结束后在后台提前生成心声札记，主动话题的语音回复也会跟随预热；会额外消耗一次模型调用，关闭后仍可在可见消息上手动点击心声按钮按需生成
        output:
          label: 自然输出节奏
          description: 在句子之间保留自然停顿，让表达更像思考后说出。
        output-delay:
          label: 停顿时长
          description: 句子间停顿的时间（毫秒）
        semantic-segmentation:
          label: 启用语义分段
          description: 按语义把回复拆成几个完整片段，避免气泡在不自然的位置断开。
          badge: 推荐
        bubble-delay:
          label: 气泡间延迟时间
          description: 多个气泡之间的延迟时间（毫秒），范围 500-5000ms
        adaptive-bubble-delay:
          label: 启用自适应气泡延迟
          description: 根据下一个气泡的文字数量自动调整延迟时间（启用后将覆盖固定延迟设置）
        typing-speed:
          label: 打字机速度
          description: 气泡内文字逐字显示的速度（毫秒/字符），范围 10-100ms
      message:
        title: 消息处理
        merging:
          label: 启用消息合并
          description: 连续收到多条消息时先合并，再作为一个完整上下文理解。
          badge: 推荐
        merge-delay:
          label: 合并等待时间
          description: 等待多久后合并消息（毫秒）
      proactive:
        title: 主动话题
        experimental: 实验性功能
        enable:
          label: 启用主动话题
          description: AI 会在合适时机主动来找你聊聊，提醒待办事项或关心近况；主动话题由隐藏触发消息生成，回复会作为 AI 消息写入当前会话，心声札记需要开启自动预热或在可见消息上手动生成
        random-interval:
          label: 启用随机间隔
          description: 允许当前居民偶尔主动打开话题，自然地来聊两句。
          badge: 推荐
        interval:
          label: 检查间隔
          description: 多久检查一次待发起话题（分钟）
        min-interval:
          label: 最小间隔
          description: 随机间隔的最小值（分钟）
        max-interval:
          label: 最大间隔
          description: 随机间隔的最大值（分钟）
        time-range:
          label: 允许时间段
          description: AI 可以主动发起对话的时间范围（24小时制）
          unit: 时
      reset: 重置为默认值
