allow-visible-on-all-workspaces:
  title: 跨桌面可見性
  description: 允許視窗在所有虛擬桌面中可見，僅限 macOS。
pages:
  notifications:
    title: 通知中心
    description: 查看曾經收到的產品公告。公告負責單向通知，客服回覆由 QQ 群承接。
    open-center: 查看通知中心
    refresh: 重新整理公告
    refresh-behavior: 主畫面啟動、切換顯示語言後及運作期間每 15 分鐘會自動更新公告；開啟本頁也會立即更新。已收到的公告儲存在本機，離線時仍可查看。
    refresh-error: 暫時無法更新公告，下方仍保留先前收到的內容。
    empty: 暫時沒有公告。
    level:
      critical: 重要
      warning: 提醒
      info: 通知
    status:
      cached: 已離線儲存
    support:
      title: 付費 Beta 客服
      description: 如有付費 Beta 使用問題或意見，請加入 QQ 群。公告只負責發布通知，客服回覆在群內進行。
      group-label: QQ 群
      copy: 複製群號
      copied: QQ 群號已複製。
      copy-error: 無法複製 QQ 群號。
  modules:
    mcp-server:
      description: 連線與管理 MCP 伺服器和工具
      title: MCP 伺服器
  system:
    sections:
      section:
        window-shortcuts:
          title: 鍵盤快捷鍵
    window-shortcuts:
      description: 修改視窗快捷方式
      title: 視窗快捷方式
      toggle-move:
        label: 切換移動狀態
      toggle-resize:
        label: 調整大小
      toggle-ignore-mouse-event:
        label: 忽略滑鼠事件
      press-keys: 請按下按鍵...
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse Tool
            description: 測試 Electron 視窗滑鼠游標位置
devtools:
  title: 開發者
  pages:
    context-flow:
      title: 上下文流程
    lag-visualizer:
      title: 卡頓可視化
    performance-visualizer:
      title: 效能顯示器
      description: 切換 FPS/長任務/記憶體覆蓋
    markdown-stress:
      title: Markdown Stress
      description: 使用大量聊天負載來進行 Markdown 解析與渲染的壓力測試
    widgets-calling:
      title: 小工具調用
screen-capture:
  permissions-prompt:
    title: 螢幕截圖
    description: 螢幕與語音錄製權限對於截取螢幕或視窗來說是必要的。
    open-preferences: 打開系統偏好設定
    dismiss: 取消
    instructions:
      step-1: 打開「系統偏好設定」，從側邊欄中選擇「隱私與安全」。
      step-2: 在「螢幕與系統聲音錄製」以及「系統聲音錄製」區域，開啟 Wuwiii 的開關。
      step-2-note: 如果 Wuwiii 沒有被列出，則請手動按下「+」按鈕並從應用資料夾選擇 Wuwiii。
