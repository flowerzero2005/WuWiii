      intro: デスクトップのワークスペースツール、トランザクション状態、そして最新の renderer 側呼び出しを確認します。
      actions:
        refresh-status: 状態を更新
        refresh-journal: ジャーナルを更新
        refresh-checkpoints: チェックポイントを更新
        refreshing: 更新中…
        loading: 読み込み中…
        run-git-status: Git status を実行
        run-git-diff: Git diff を実行
        run-typecheck: Typecheck を実行
        run-lint: Lint を実行
        preview-edit: 編集をプレビュー
        apply-edit: 編集を適用
        search-candidates: 候補を検索
        use-selected-path: 選択したパスを使う
        rollback-transaction: トランザクションをロールバック
        restore-checkpoint: チェックポイントを復元
        create-checkpoint: チェックポイントを作成
        load-more-transactions: さらにトランザクションを読み込む
        load-more-checkpoints: さらにチェックポイントを読み込む
        cancel: キャンセル
      labels:
        persona-runtime-signals: ランタイムシグナル
        persona-runtime-overhang: 感情の余韻
        persona-runtime-last-failure-kind: 直近の失敗種別
        persona-runtime-repeated-openings: 繰り返しの冒頭
        persona-runtime-repeated-endings: 繰り返しの結び
        persona-runtime-repeated-self-references: 繰り返しの自己言及
        persona-metrics:
          closeness: 親密さ
          seriousness: 真剣度
          hurt: 傷つき
          affection: 愛着
          need-for-attention: 注目されたい度
          arousal: 活性度
          inhibition: 抑制度
        search: '検索：'
        read: '読み取り：'
        write: '書き込み：'
        git-status: 'Git status:'
        git-diff: 'Git diff:'
        typecheck: 'Typecheck:'
        lint: 'Lint:'
        requested-bundles: リクエストした bundles
        available-bundles: 許可された bundles
        blocked-bundles: ブロックされた bundles
        detected-intent: 検出された意図
        last-tool-route-diagnostic: 直近の LLM ツールルート診断
        risk: リスク
        rollback: ロールバック可
        target-session: 対象セッション
        last-created: 最後に作成
        last-restored: 最後に復元
        last-rollback: 最後にロールバック
      descriptions:
        restricted-git-commands: 現在許可している読み取り専用の Git 制限コマンドを手動実行し、最新結果と journal 記録をその場で確認します。
        git-status: '固定パラメータテンプレートで `git status --short --branch` を実行し、出力を command transaction として記録します。'
        git-diff: 'パス、staged モード、文脈行数、出力上限を指定して制限付き `git diff` を実行します。'
        restricted-typecheck: 現在許可している whitelist 付き typecheck コマンドを手動実行し、最新出力と journal 記録をその場で確認します。
        typecheck: 許可済み Wuwiii ワークスペース target の 1 つに対して、制限付き package-scoped typecheck adapter を実行します。
        restricted-lint: 現在許可している whitelist 付き lint コマンドを手動実行し、最新出力と journal 記録をその場で確認します。
        lint: 許可済み Wuwiii ワークスペース target の 1 つに対して、制限付き package-scoped lint adapter を実行します。
        guarded-text-edit-preview: builtin tools と同じ preview -> proposal -> apply の guarded edit フローを dry-run し、変更サマリーと unified diff を確認してから、この preview が返した proposalId を必要に応じて journal 付き書き込みとして適用します。
        journal-transactions: 更新日時が新しい順に並んだ disk-backed manifest です。
        checkpoints: 現在選択中、または最新セッション用の手動チェックポイントを作成します。
      fields:
        search-query:
          label: 検索クエリ
          description: 候補ファイルを探すためのパス断片または周辺テキストです。
        scope:
          label: 範囲
          description: 検索範囲を絞るための任意のワークスペース相対ディレクトリです。
        search-mode:
          label: 検索モード
          description: Auto は path と text の両方を試します。path / text はより厳格なフィルタです。
        search-limit:
          label: 検索上限
          description: 候補ファイルパスを出す前に調べる検索ヒット数の上限です。
        candidate-file:
          label: 候補ファイル
          description: 複数候補が返った場合に正確なファイルを選びます。
        workspace-path:
          label: ワークスペースパス
          description: プレビューまたは編集するワークスペース相対ファイルパスです。
        edit-mode:
          label: 編集モード
          description: builtin tools が使う write-text strategy と同じモードを使用します。
        allow-create-if-missing:
          label: 存在しない場合は作成を許可
          description: preview/apply が存在しないパスを新規ファイルとして扱えるようにします。
        content:
          label: 内容
          description: 選択した編集モードで置換・追記・挿入されるテキストです。
          placeholder: この編集で使うテキスト
        target-marker:
          label: ターゲットマーカー
          description: marker/match ベースの編集モードで必須です。
          placeholder: 正確なマーカーまたは一致テキスト
        occurrence:
          label: 出現番号
          description: replace-nth-match でのみ使う 1 始まりの一致番号です。
        range-start:
          label: 範囲開始
          description: replace-range で使う開始文字オフセット（含む）です。
        range-end:
          label: 範囲終了
          description: replace-range で使う終了文字オフセット（含まない）です。
        preview-chars:
          label: プレビュー文字数
          description: before/after/diff プレビューの文字数上限です。
        max-read-bytes:
          label: 最大読み取りバイト数
          description: 任意の読み取り上限です。空欄の場合はサービス既定値を使います。
        git-diff-path:
          label: Diff パス
          description: 任意のワークスペース相対パスです。空欄ならワークスペース全体を diff します。
        git-diff-staged:
          label: staged 差分を見る
          description: '有効にすると `--cached` を使い、working tree ではなく staged diff を確認します。'
        git-diff-context-lines:
          label: 文脈行数
          description: '`git diff --unified=<n>` の文脈行数です。範囲は 0-20 です。'
        git-diff-max-bytes:
          label: 出力バイト上限
          description: 任意の出力上限です。空欄ならサービス既定値を使います。
        typecheck-target:
          label: Typecheck target
          description: 制限付き typecheck adapter を実行する許可済み Wuwiii ワークスペース target です。
        typecheck-max-bytes:
          label: 出力バイト上限
          description: 任意の出力上限です。空欄ならサービス既定値を使います。
        lint-target:
          label: Lint target
          description: 制限付き lint adapter を実行する許可済み Wuwiii ワークスペース target です。
        lint-max-bytes:
          label: 出力バイト上限
          description: 任意の出力上限です。空欄ならサービス既定値を使います。
