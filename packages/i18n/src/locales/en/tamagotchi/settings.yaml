      descriptions:
        restricted-git-commands: Manually run the currently allowed readonly Git commands and inspect the latest result alongside the journal record.
        git-status: 'Run `git status --short --branch` through the fixed restricted adapter and journal the output as a command transaction.'
        git-diff: 'Run the restricted `git diff` adapter with optional path, staged mode, context lines, and output cap.'
        restricted-typecheck: Manually run the current whitelist-only typecheck command and inspect its latest output alongside the journal record.
        typecheck: Run the restricted package-scoped typecheck adapter for one allowed Wuwiii workspace target.
        restricted-lint: Manually run the current whitelist-only lint command and inspect its latest output alongside the journal record.
        lint: Run the restricted package-scoped lint adapter for one allowed Wuwiii workspace target.
        guarded-text-edit-preview: Dry-run the same preview -> proposal -> apply guarded edit flow used by the builtin tools, inspect the change summary + unified diff preview, then decide whether to apply the returned proposalId as a journaled write.
        journal-transactions: Disk-backed manifests sorted by latest update time.
        checkpoints: Create manual checkpoints for the currently selected or latest session.
      fields:
        search-query:
          label: Search query
          description: Path fragment or nearby text used to locate candidate files.
        scope:
          label: Scope
          description: Optional workspace-relative directory to narrow the search.
        search-mode:
          label: Search mode
          description: Auto tries both path and text; path and text are stricter filters.
        search-limit:
          label: Search limit
          description: Maximum search matches to inspect before producing candidate file paths.
        candidate-file:
          label: Candidate file
          description: Choose the exact file when the search returns multiple candidate paths.
        workspace-path:
          label: Workspace path
          description: Workspace-relative file path to preview or edit.
        edit-mode:
          label: Edit mode
          description: Use the same write-text strategy modes exposed to builtin tools.
        allow-create-if-missing:
          label: Allow create-if-missing
          description: Permit preview/apply to treat a missing path as a new file.
        content:
          label: Content
          description: Replacement, appended, or inserted text payload for the selected edit mode.
          placeholder: Text payload for this edit
        target-marker:
          label: Target marker
          description: Required for marker/match-based edit modes.
          placeholder: Exact marker or match text
        occurrence:
          label: Occurrence
