allow-visible-on-all-workspaces:
  title: Cross-Space Visibility
  description: Allow the window to be visible on all workspaces, macOS only.
pages:
  notifications:
    title: Notification Center
    description: Review product announcements you have received. Announcements are outbound notices; support replies are handled in the QQ group.
    open-center: Open notification center
    refresh: Refresh announcements
    refresh-behavior: On the main screen, announcements refresh at startup, after the display language changes, and every 15 minutes. Opening this page also refreshes them. Received items are stored on this device and remain available offline.
    refresh-error: Announcements could not be refreshed. Previously received items remain available below.
    empty: No announcements yet.
    popups:
      title: Show announcement popups
      description: When off, announcements remain in the notification center without appearing over the main screen. Re-enabling does not replay older announcements received while off.
    level:
      critical: Critical
      warning: Warning
      info: Information
    status:
      cached: Saved offline
    support:
      title: Paid Beta support
      description: For paid Beta questions and feedback, join the QQ group. Announcements are for outbound notices; replies happen in the group.
      group-label: QQ group
      copy: Copy group number
      copied: QQ group number copied.
      copy-error: Could not copy the QQ group number.
  official-voices:
    title: Official Voices
    description: Browse, search, and favorite Wuwiii official voices. A selection takes effect only after the server catalog confirms it.
    views:
      recommended: Recommended
      all: All
      favorites: Favorites
      recent: Recent
    channels:
      primary: Primary voices
      secondary: Secondary voices
    statuses:
      idle: Idle
      busy: Busy
      congested: Congested
      maintenance: Maintenance
      error: Unavailable
      recovering: Recovering
    search: Search names, descriptions, or voice IDs
    all-languages: All languages
    current: Current voice
    billing-rule: 'Base {points} pts/min, {minimum} pt minimum; voice add-on {surcharge} pts/use'
    per-minute: Base speech
    minimum-base: Minimum base charge
    per-use-surcharge: Voice add-on
    points-short: pts
    points-value: '{points} pts'
    points-per-minute: '{points} pts/min'
    points-per-use: '{points} pts/use'
    rate-with-surcharge: '{points} pts/min + {surcharge} pts/use'
    price-follows-server: Final charge uses actual audio duration
    loading: Loading official voices…
    load-error: The official voice catalog is unavailable. Your current voice has not changed; try again later.
    empty: No voices match these filters.
    favorite: Favorite voice
    points: points/request
    use: Use this voice
    in-use: In use
    unavailable: This voice is archived or unavailable on the current plan. Your previous voice is unchanged.
    selected: Voice changed.
    preview: Preview voice
    preview-error: The preview could not be played.
    load-more: Load more
  modules:
    mcp-server:
      description: Connect and manage MCP server and tools
      title: MCP Server
  speech:
    title: Speech Settings
    description: Help the current resident find a fitting voice, from providers and playback to quick first words.
    info:
      title: Centralized Speech Controls
      description: 'Everything the current resident needs to listen and speak lives here: synthesis, recognition, provider setup, playback, and latency checks.'
    providers:
      title: Speech Providers
      description: Configure the TTS and STT providers used by the current resident, including Alibaba, Volcengine, and OpenAI-compatible APIs.
  system:
    sections:
      section:
        window-shortcuts:
          title: Keyboard Shortcuts
    window-shortcuts:
      description: Modify the window shortcuts.
      title: Window Shortcuts
      toggle-move:
        label: Toggle Move
      toggle-resize:
        label: Toggle Resize
      toggle-ignore-mouse-event:
        label: Toggle Ignore Mouse Event
      press-keys: Press Keys...
    speech-output:
      title: Speech Output
      description: Shape how the current resident turns a reply into speech, from the first sound to the final pause.
      mode:
        label: Output mode
        fast: Low latency
        balanced: Balanced
        smooth: Smooth
        custom: Custom
      mode-description:
        fast: Generate the first speech segment sooner for real-time Chinese replies.
        balanced: Balance response speed with natural pauses.
        smooth: Wait for fuller sentence groups for smoother speech with higher latency.
        custom: Manually tune chunking and first-segment boost.
      custom-settings:
        title: Custom chunking
        boost:
          label: First-segment boost
          description: Let the current resident begin speaking as soon as the opening segment reaches the minimum unit count.
        min-words:
          label: Minimum speech units
          description: Wait for a segment to reach this size before the current resident speaks when possible.
        max-words:
          label: Maximum speech units
          description: Start speaking at this size even when the sentence has not found its punctuation yet.
        merge-short-sentences:
          label: Merge short sentences
          description: Gather short sentences until the minimum speech unit count is reached for a smoother rhythm with fewer TTS requests.
    speech-playback:
      title: Speech Playback
      description: Keep the current resident's voice natural with playback buffering, TTS timeouts, and interruption controls.
    speech-latency:
      title: Speech Latency
      description: See where the current resident's voice spends time across recent synthesis, decoding, and failures.
    quick-chat:
      title: Quick Chat
      description: Style your desktop chat corner and the current resident's floating replies.
      info:
        title: Desktop quick chat surface
        description: These choices shape the floating input window and reply bubbles beside the current resident during quick chat.
      sections:
        behavior: Window
        bubbles: Reply Bubbles
      window-controls:
        close-settings: Close quick chat settings
        drag: Drag to move quick chat
        drag-voice-call: Drag to move voice call
        expand: Expand quick chat
        resize: Use the upper handle to move; drag either edge to resize
        settings: Open quick chat settings
        collapse: Collapse quick chat
        hide: Hide quick chat
        hide-confirm-title: Hide Quick Chat?
        hide-confirm-description: You can reopen it from the Butler orb or tray menu. Your chat history will be kept.
        hide-confirm-cancel: Cancel
        hide-confirm-action: Hide
        you: You
      custom-position:
        title: Custom position saved
        description: Your chat corner is resting at X {x}, Y {y}.
        clear: Clear custom position
      fields:
        recommended-replies:
          description: Disabled by default. When enabled, each completed assistant reply makes one additional request to your selected third-party provider and may incur provider charges. Official cloud stays disabled until separate pricing consent is available.
          label: Generate reply suggestions (uses an additional model request)
        floating-replies-enabled:
          label: Show floating desktop replies
          description: Show user, thinking, and reply bubbles near the resident only for collapsed quick chat or voice calls.
        follow-chat-appearance:
          label: Follow chat bubble appearance
          description: Let desktop replies match your usual chat typography, colors, images, and shape. Turn this off to style your bubbles and the resident's separately.
        auto-open:
          label: Open quick chat on startup
          description: Have quick chat pop in to greet you whenever the desktop stage opens.
        always-on-top:
          label: Keep above other windows
          description: Keep quick chat perched above your other desktop windows.
        visible-on-all-workspaces:
          label: Show on all workspaces
          description: Let quick chat stay by your side as you switch between virtual desktops.
        click-through-when-blurred:
          label: Click-through when blurred
          description: After quick chat loses focus, mouse clicks pass through its window. Reopen quick chat when you want to interact again.
        dock:
          label: Dock position
          description: Choose where compact quick chat settles, or pick Custom to place it yourself.
        collapsed-width:
          label: Collapsed width
          description: Give the compact input bar just the right amount of room.
        expanded-width:
          label: Expanded width
          description: Choose how wide the expanded chat panel can stretch.
        expanded-height:
          label: Expanded height
          description: Choose how tall the expanded chat panel can grow.
        separate-dark-background:
          label: Use a separate dark background
          description: Give dark mode its own background image instead of sharing the light one.
        floating-user-background-light:
          label: My desktop bubble background
          description: Place an image behind the messages you send on the desktop.
        floating-user-background-dark:
          label: My dark desktop bubble background
          description: Place a separate image behind your desktop messages in dark mode.
        floating-assistant-background-light:
          label: Resident desktop bubble background
          description: Add an image behind the current resident's desktop replies.
        floating-assistant-background-dark:
          label: Resident dark desktop bubble background
          description: Add a dark-mode image behind the current resident's desktop replies.
        floating-background-strength:
          label: Desktop bubble image strength
          description: Balance the background image with the message text so every word stays easy to read.
        reply-anchor:
          label: Reply bubble position
          description: Choose where the current resident's reply bubbles appear.
        thinking-bubble-offset-x:
          label: Thinking bubble X offset
          description: Nudge the thinking bubble from the resident's reference point. Negative moves left; positive moves right.
        thinking-bubble-offset-y:
          label: Thinking bubble Y offset
          description: Nudge the thinking bubble from the resident's reference point. Negative moves up; positive moves down.
        reply-bubble-offset-x:
          label: Reply bubble X offset
          description: Nudge reply bubbles from the resident's reference point. Negative moves left; positive moves right.
        reply-bubble-offset-y:
          label: Reply bubble Y offset
          description: Nudge reply bubbles from the resident's reference point. Negative moves up; positive moves down.
        sent-preview-duration:
          label: Sent preview duration
          description: Choose how long your sent-message preview lingers on screen.
        reply-bubble-dwell:
          label: Reply dwell duration
          description: Choose how long the resident's reply stays after the typing animation ends.
        bubble-enter-duration:
          label: Bubble appear duration
          description: Set how gently each bubble appears.
        bubble-exit-duration:
          label: Bubble disappear duration
          description: Set how gently each bubble slips away.
      options:
        background:
          none: No image
        dock:
          top-left: Top left
          top-right: Top right
          bottom-left: Bottom left
          bottom-right: Bottom right
          custom: Custom / dragged
        reply-anchor:
          near-character: Near character
          top-center: Top center
          bottom-center: Bottom center
      actions:
        reset-behavior: Reset window
        reset-bubbles: Reset bubbles
        reset: Reset all quick chat settings
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse Tool
            description: Test the Electron window cursor position
    memory-advanced:
      title: Memory Advanced Settings
      description: Fine-tune how the current resident remembers and connects ideas.
      info:
        title: Advanced Memory Features
        description: These optional features are off by default. Enable those that help the current resident remember more naturally; existing memories remain compatible.
      scope-overview:
        title: How memory is separated
        description: Conversation history and long-term memory use different boundaries so one persona cannot inherit another persona's private understanding.
        persona:
          title: Persona memory
          status: Isolated
          description: Stored by user and persona for direct conversations.
        room:
          title: Room history
          status: Recorded
          description: Public messages retain their room and speaker identity.
        group:
          title: Group long-term memory
          status: Paused
          description: Automatic extraction stays off until room and persona scopes can be passed explicitly.
      isolation:
        title: Memory Isolation
        multi-user:
          label: Enable Multi-User Recognition
          description: Recognize different users by device and keep a separate memory space for each person.
          warning: First-time activation will automatically migrate existing data to the new user, original data will not be lost
      semantic:
        title: Semantic Understanding
        search:
          label: Enable Semantic Search
          description: Help the current resident follow connections between ideas by expanding keywords through the knowledge graph.
        official-cloud-embedding:
          label: Use Official Cloud Embeddings
          description: When enabled, the current query and eligible memory text are sent to Wuwiii's official embedding service and consume account points. Local keyword recall remains the fallback. Disabled by default.
          pricing:
            loading: Loading the current official cloud price…
            official: 'Official cloud: {points} points per embedding request. Local keyword recall does not consume official points.'
          status:
            checking: Checking the official semantic memory service…
            available: The official semantic memory service is available. Text is sent and points are charged at the current server price only after you enable it.
            unavailable: The official semantic memory service is unavailable. Local keyword recall remains active and no memory text is sent.
        value-judgment:
          label: Smart Value Judgment
          description: Let the current resident reconsider each memory's value and filter out temporary details.
      natural:
        title: Natural Conversation
        conversation-init:
          label: Conversation Initialization
          description: Let the current resident greet you with remembered details when appropriate.
        inner-voice-prewarm:
          label: Prewarm Inner Voice Notes
          description: Generate inner voice notes in the background after replies, including spoken proactive-topic replies. This uses an extra model call. When disabled, the heart button can still generate notes for visible messages.
        output:
          label: Natural Output Rhythm
          description: Add small pauses between sentences for a more natural rhythm.
        output-delay:
          label: Pause Duration
          description: Choose the pause between resident sentences (milliseconds).
        semantic-segmentation:
          label: Enable Semantic Segmentation
          description: Group replies by meaning instead of cutting them at every sentence break.
          badge: Recommended
        bubble-delay:
          label: Bubble Delay
          description: Choose the pause between consecutive bubbles (milliseconds).
        adaptive-bubble-delay:
          label: Adaptive Bubble Delay
          description: Adjust each pause to the length of the next bubble. This replaces the fixed delay while enabled.
        typing-speed:
          label: Typewriter Speed
          description: Choose how quickly each character appears inside a bubble (milliseconds per character).
      message:
        title: Message Processing
        merging:
          label: Enable Message Merging
          description: Gather consecutive messages before the current resident reads and responds.
          badge: Recommended
        merge-delay:
          label: Merge Wait Time
          description: Choose how long the current resident waits for another message before merging them (milliseconds).
      proactive:
        title: Proactive Topics
        experimental: Experimental
        enable:
          label: Enable Proactive Topics
          description: Let the current resident start a conversation at appropriate times to remind you about tasks or check in. Proactive topics use a hidden trigger message, and the reply is saved as an AI message in the current session. Inner voice notes require automatic prewarm or manual generation on the visible message.
        random-interval:
          label: Enable Random Interval
          description: Vary when the current resident speaks so check-ins feel less mechanical.
          badge: Recommended
        interval:
          label: Check Interval
          description: Choose how often the current resident checks for a topic waiting to be mentioned (minutes).
        min-interval:
          label: Minimum Interval
          description: Set the shortest possible wait when random intervals are enabled (minutes).
        max-interval:
          label: Maximum Interval
          description: Set the longest possible wait when random intervals are enabled (minutes).
        time-range:
          label: Allowed Time Range
          description: Choose when the current resident may start a conversation (24-hour format).
          unit: hour
      reset: Reset to Defaults
