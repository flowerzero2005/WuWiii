          how-it-works-description: When buffering is enabled, playback starts after at least {minSegments} speech segments are ready or after {bufferTimeout}ms. Disabling buffering gives faster first audio; enabling it makes long replies smoother.
        interruption:
          title: Speech Interruption
          description: Control how user speech interrupts AI audio playback.
          how-it-works-title: How it works
          how-it-works-description: When smart interruption is enabled, Wuwiii watches the user speech state. AI speech is interrupted only after user speech is detected for {threshold}ms, reducing false triggers from short noise.
      fields:
        speech-output-enabled:
          label: Enable AI reply speech
          description: When disabled, chat replies will not send TTS requests, avoiding accidental speech quota usage. Test voice still works.
        output-volume:
          label: Playback volume
          description: Adjust the current resident's speech playback volume without changing system volume.
        emotion-mode:
          label: Emotional speech
          description: Choose whether the voice follows the current character and conversation. Speech models without tone controls keep their normal neutral delivery.
        emotion-intensity:
          label: Emotion intensity
          description: Control how far the delivery moves from neutral. 0% keeps the original neutral voice.
        display-sync-with-speech:
          label: Sync bubbles with speech
          description: When enabled, reply bubbles wait for speech synthesis or playback events, keeping the thinking bubble visible until speech is ready.
        display-sync-trigger:
          label: Bubble display trigger
          description: Playback start aligns better with Live2D lip sync; TTS ready displays earlier, but can appear before audible speech.
        display-sync-late-speech-policy:
          label: Late speech handling
          description: Choose whether Wuwiii keeps waiting for speech, or shows text first and drops late audio when the current turn misses the sync fallback.
        display-sync-delay:
          label: Bubble display delay trim
          description: Add a small delay after the speech event before showing the bubble, useful for manually tuning lip-sync timing.
        display-sync-fallback:
          label: Sync fallback timeout
          description: If speech synthesis fails or returns no audio, show text after this timeout so the reply does not stay in thinking state.
        buffering-enabled:
          label: Enable playback buffering
          description: Wait for multiple speech segments before playback. This sounds smoother, but increases first-audio latency.
        tts-request-timeout:
          label: TTS request timeout
          description: Skip a speech segment when the provider does not return in time, and lower that provider's recommendation priority. For low-latency Chinese, 3500-6000ms is a practical range.
        tts-request-min-interval:
          label: Minimum TTS request interval
          description: Minimum wait time between speech synthesis requests. The default 0 does not actively throttle; raise it when a provider returns 429s.
        tts-rate-limit-retry-delay:
          label: Rate-limit retry cooldown
          description: Wait this long before retrying after provider 429 or rate-limit errors. Cloned voices or strict models may need 6000-12000ms.
        min-segments:
          label: Minimum buffered segments
          description: How many speech segments should be buffered before playback starts. Use 1-2 for low latency and 3-5 for smoother playback.
        buffer-timeout:
          label: Buffer timeout
          description: Start playback after this wait time to avoid blocking too long. For low latency, 600-1200ms is recommended.
        interruption-enabled:
          label: Enable smart interruption
          description: Interrupt AI speech only when continuous user speech is detected, avoiding false triggers from brief noise.
        continuous-detection-threshold:
          label: Continuous detection threshold
          description: How long user speech must be detected before interruption. 300-1000ms is recommended.
        speech-end-buffer:
          label: Speech end buffer
          description: How long to wait after the user stops speaking before treating speech as ended. 300-800ms is recommended.
      units:
        segments: '{count} segments'
      options:
        emotion-mode:
          follow-character: Follow character
          natural: Natural and restrained
          off: Off
        display-sync-trigger:
          playback-start: Playback start
          tts-result: TTS ready
        display-sync-late-speech-policy:
          text-first-drop-late: Text first, drop late speech
          wait-for-speech: Speech first
