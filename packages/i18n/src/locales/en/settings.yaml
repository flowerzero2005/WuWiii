dialogs:
  onboarding:
    title: Welcome to Wuwiii!
    description: Choose how Wuwiii connects to AI, then review character, voice, desktop tools, and data controls.
    selectProvider: Choose an AI Provider
    configureProvider: Configure {provider}
    apiKey: API Key
    apiKeyHelp: Get your API key from {provider} and paste it here
    baseUrl: Base URL
    baseUrlHelp: API endpoint URL (use default if unsure)
    accountId: Account ID
    validationSuccess: Configuration validation success
    validationFailed: Configuration validation failed
    validationError: 'Validation error: {error}'
    skipForNow: Skip for now
    saveAndContinue: Save and Continue
    next: Next
    retry: Retry
    start: Let's do it!
    select-model: Choose model
    no-models: No available models
    no-models-help: >-
      Return to the previous steps and check the provider account, API key, or
      local model runtime selected for this setup path.
    back: Back
    credentials:
      title: Keep your provider credentials private
      description: Your API key is stored in this Wuwiii installation. Treat it like a password and do not share it.
    officialCloud:
      title: Account sign-in is completed separately
      description: This selects Wuwiii Official Cloud, but it does not sign you in or purchase points. After onboarding, open Account & Points to sign in before your first cloud request.
    localProvider:
      title: The local model service must already be running
      description: Wuwiii stores this local endpoint and connects to it. It does not install, download, or start Ollama or LM Studio.
    steps:
      path:
        title: Choose how Wuwiii connects to AI
        description: Pick the route that matches your account and privacy needs. You can change providers later.
        options:
          official-cloud:
            title: Wuwiii Official Cloud
            description: The simplest route. Sign in after onboarding and use account points; no provider API key is entered here.
          byok:
            title: Use my own API key
            description: Connect OpenAI, Anthropic, Gemini, OpenRouter, or another compatible hosted provider with credentials you control.
          local:
            title: Pure local model
            description: Connect Ollama or LM Studio running on this device. Wuwiii does not install or start the local model runtime for you.
        selected:
          official-cloud: You chose Official Cloud. No provider key is required here; account sign-in remains a separate step.
          byok: You chose your own provider credentials. Pick the hosted provider whose key you already have.
          local: You chose a local runtime. Make sure Ollama or LM Studio is installed, running, and exposing its local API.
      personalize:
        title: Make your digital resident feel at home
        description: Character and appearance are independent from the AI provider. This guide does not replace or import a character automatically.
        items:
          character:
            title: Character & persona
            description: Choose the built-in character or import a character package, then review its persona and model settings.
            location: Settings > Character
          theme:
            title: Theme & conversation appearance
            description: Choose light or dark mode, colors, backgrounds, and message appearance from the appearance settings.
            location: Settings > System > Appearance & Background
      voice:
        title: Voice and microphone
        description: Voice output and speech input are optional. Wuwiii asks for device permission only when you use a microphone feature.
        items:
          speech:
            title: Speech output
            description: Select and test a speech provider, model, and voice. Choosing an AI chat provider does not automatically configure speech.
            location: Settings > Modules > Speech
          microphone:
            title: Speech input
            description: Select a transcription provider and input device before using voice input.
            location: Settings > Modules > Hearing
          permission:
            title: Microphone permission
            description: Grant access only in the operating-system prompt shown when recording starts. This onboarding step does not request permission.
            location: Requested by the operating system when recording starts
      tools:
        title: Desktop tools
        description: These tools remain off-screen until you open them. Review each workflow before relying on it.
        items:
          quick-chat:
            title: Quick Chat
            description: A compact desktop conversation window with its own size, placement, and speech behavior settings.
            location: Settings > System > Quick Chat
          butler:
            title: Butler
            description: Create and confirm reminders, alarms, and timers. Wuwiii does not create a task until the confirmation flow succeeds.
            location: Open Butler from the desktop controls
          workbench:
            title: Workbench
            description: Use a workspace for files, previews, tools, and longer tasks. Actions with side effects retain their own confirmation rules.
            location: Open Workbench from the desktop controls
      data:
        title: Your data and diagnostics
        description: Wuwiii keeps local conversation and preference data on this installation. Destructive cleanup stays behind explicit confirmation.
        items:
          storage:
            title: Data controls
            description: Review stored data and export or reset options before making changes.
            location: Settings > Data
          diagnostics:
            title: Memory diagnostics
            description: Inspect memory health and indexing status when recall does not behave as expected.
            location: Settings > Memory > Diagnostics
          cleanup:
            title: Cleanup
            description: Cleanup is not run by onboarding. Use the data settings later and confirm exactly what will be removed.
            location: Settings > Data
    summary:
      title: Setup overview
      description: Your chat provider and model are selected. Optional character, voice, tool, and data settings remain available afterward.
      path: Connection path
      provider: Provider
      model: Model
      notSelected: Not selected
      afterTitle: Continue in Settings
      afterDescription: These areas contain the optional controls described in the guide. Nothing there was changed automatically.
      afterItems:
        character: Character & appearance
        voice: Voice & microphone
        tools: Desktop tools
        data: Data & diagnostics
      complete: Finish setup
