          placeholder: The current resident is working with the user inside Workbench...
        concise-reports:
          label: Concise reports
          description: Prefer short progress reports and put the useful result first.
        fold-internal-details:
          label: Fold internal details
          description: Keep raw planning, prompt mechanics, and command logs out of the main reply when Workbench can show them separately.
        companion-warmth:
          label: Companion warmth
          description: Adjust how much familiar companion tone appears while staying work-first.
      hard-rules:
        title: Protected Workbench rules
        description: These rules are always applied in Workbench and cannot be removed from this page.
        rule-1: Use this work style only for Workbench tasks. It supplements the active character card.
        rule-2: Put the useful result first and keep visible replies short unless the user asks for details.
        rule-3: Let the active persona show through lightly, without roleplay or idle banter during work.
        rule-4: Keep internal plans, prompt mechanics, safety wording, and command logs folded when possible.
        rule-5: Use preview-first file editing; applying writes still requires an explicit UI action or clear apply/write language.
        rule-6: Low-risk auxiliary checks may run when policy allows, while installs, deletes, elevated actions, unapproved external access, and cross-workspace actions stay guarded. Short confirmations are not consent to write, apply, or run.
      prompt-preview:
        title: Advanced prompt preview
        description: Shows the Workbench work style section that future model calls will receive.
